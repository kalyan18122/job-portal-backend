# Server
server.port=${PORT:8080}

# Database (local MySQL by default; Render's DB_URL, DB_USER, DB_PASSWORD override these)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/job_portal_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:kalyan}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=${JWT_SECRET:ReplaceThisWithASecureRandomSecretKeyOfAtLeast32Characters}
jwt.expiration-ms=86400000